values:
  # "$iam_role_sets:viewer_plus" expands to two bindings; members from iam and iam_by_principals are merged per role
  google_folder_iam_binding.authoritative["roles/browser"]:
    condition: []
    members:
    - serviceAccount:sa@project.iam.gserviceaccount.com
    - user:user@example.com
    role: roles/browser
  google_folder_iam_binding.authoritative["roles/viewer"]:
    condition: []
    members:
    - serviceAccount:sa@project.iam.gserviceaccount.com
    - user:user@example.com
    role: roles/viewer

counts:
  google_folder: 1
  google_folder_iam_binding: 2
  modules: 0
  resources: 3
