values:
  # var.iam key + var.iam_by_principals value: both expand and members are merged per role
  google_folder_iam_binding.authoritative["roles/browser"]:
    condition: []
    members:
    - serviceAccount:sa@project.iam.gserviceaccount.com
    - user:user@example.com
    role: roles/browser
  google_folder_iam_binding.authoritative["roles/viewer"]:
    condition: []
    members:
    - serviceAccount:sa@project.iam.gserviceaccount.com
    - user:user@example.com
    role: roles/viewer
  # var.iam_by_principals_conditional: role set expands to one conditional binding per role
  google_folder_iam_binding.bindings["iam-bpc:roles/browser-expires_soon"]:
    condition:
    - description: null
      expression: request.time < timestamp("2027-01-01T00:00:00Z")
      title: expires_soon
    members:
    - serviceAccount:sa@project.iam.gserviceaccount.com
    role: roles/browser
  google_folder_iam_binding.bindings["iam-bpc:roles/viewer-expires_soon"]:
    condition:
    - description: null
      expression: request.time < timestamp("2027-01-01T00:00:00Z")
      title: expires_soon
    members:
    - serviceAccount:sa@project.iam.gserviceaccount.com
    role: roles/viewer
  # var.iam_by_principals_additive: role set expands to one additive member binding per role
  google_folder_iam_member.bindings["iam-bpa:$iam_principals:myuser-roles/browser"]:
    condition: []
    member: user:user@example.com
    role: roles/browser
  google_folder_iam_member.bindings["iam-bpa:$iam_principals:myuser-roles/viewer"]:
    condition: []
    member: user:user@example.com
    role: roles/viewer

